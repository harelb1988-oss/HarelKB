name: Build HarelKB
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Fix project structure
        run: |
          mkdir -p app/src/main/java/com/harelkb/keyboard
          mkdir -p app/src/main/res/xml
          for f in *.kt; do [ -f "$f" ] && cp "$f" app/src/main/java/com/harelkb/keyboard/ || true; done
          if [ -f AndroidManifest.xml ]; then cp AndroidManifest.xml app/src/main/AndroidManifest.xml; fi
          if [ -f method.xml ]; then cp method.xml app/src/main/res/xml/method.xml; fi
          if [ ! -f app/src/main/res/xml/method.xml ]; then
            echo '<?xml version="1.0" encoding="utf-8"?><input-method xmlns:android="http://schemas.android.com/apk/res/android"><subtype android:label="@string/app_name" android:imeSubtypeLocale="he" android:imeSubtypeMode="keyboard" /></input-method>' > app/src/main/res/xml/method.xml
          fi
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "HarelKB"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins { id("com.android.application") version "8.2.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false }
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
            namespace = "com.harelkb.keyboard"
            compileSdk = 34
            defaultConfig { applicationId = "com.harelkb.keyboard"; minSdk = 26; targetSdk = 34; versionCode = 1; versionName = "4.0" }
            buildTypes { release { isMinifyEnabled = false } }
            compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = "17" }
          }
          dependencies { implementation("androidx.core:core-ktx:1.12.0"); implementation("androidx.appcompat:appcompat:1.6.1") }
          EOF
      - name: Build APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HarelKB-APK
          path: '**/build/outputs/apk/debug/*.apk'
